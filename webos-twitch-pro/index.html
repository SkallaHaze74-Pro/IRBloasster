<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitch TV Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <header>
      <div class="logo">TV</div>
      <div>
        <p class="eyebrow">SMARTIR · PRIVATE TV APP</p>
        <h1>Twitch TV Pro</h1>
        <p id="status">Source-Player, Login und Gefolgt im LG-Browser</p>
      </div>
    </header>

    <section class="tiles">
      <button class="tile featured" data-target="player" type="button">
        <span class="number">1</span>
        <strong>Source Player</strong>
        <span>Höchste verfügbare Qualität automatisch wählen</span>
      </button>

      <button class="tile" data-target="following" type="button">
        <span class="number">2</span>
        <strong>Gefolgt & Login</strong>
        <span>Offizielle Twitch-Seite mit gespeichertem Browser-Login</span>
      </button>

      <button class="tile" data-target="home" type="button">
        <span class="number">3</span>
        <strong>Twitch Home</strong>
        <span>Kategorien, Suche und Empfehlungen öffnen</span>
      </button>
    </section>

    <footer>
      <span>◀ ▶ Auswahl</span>
      <span>OK öffnen</span>
      <span>1–3 Schnellwahl</span>
      <span>Zurück schließen</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
