plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def capsuleHome = new File(System.getProperty('user.home'), '.musiccapsule')
def capsuleKeystore = new File(capsuleHome, 'music-capsule-release.jks')
def capsuleSigningPropsFile = new File(capsuleHome, 'signing.properties')
def capsuleSigningProps = new Properties()
if (capsuleSigningPropsFile.exists()) {
    capsuleSigningPropsFile.withInputStream { capsuleSigningProps.load(it) }
}
def capsuleSigningReady = capsuleKeystore.exists() &&
    capsuleSigningProps.getProperty('storePassword') &&
    capsuleSigningProps.getProperty('keyAlias') &&
    capsuleSigningProps.getProperty('keyPassword')

android {
    namespace 'com.skallahaze.musiccapsule'
    compileSdk 34

    defaultConfig {
        applicationId 'com.skallahaze.musiccapsule'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        if (capsuleSigningReady) {
            capsuleStable {
                storeFile capsuleKeystore
                storePassword capsuleSigningProps.getProperty('storePassword')
                keyAlias capsuleSigningProps.getProperty('keyAlias')
                keyPassword capsuleSigningProps.getProperty('keyPassword')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }

    buildTypes {
        debug {
            if (capsuleSigningReady) {
                signingConfig signingConfigs.capsuleStable
            }
        }
        release {
            if (capsuleSigningReady) {
                signingConfig signingConfigs.capsuleStable
            }
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
