name: SmartIR Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/smartir-1.2-tv-lab]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartir-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test, lint and build debug plus compact APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug assembleCompact

      - name: Prepare named APKs and checksums
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SmartIR-v1.2.5-debug.apk
          cp app/build/outputs/apk/compact/app-compact.apk SmartIR-v1.2.5-compact.apk
          sha256sum SmartIR-v1.2.5-debug.apk > SmartIR-v1.2.5-debug.apk.sha256
          sha256sum SmartIR-v1.2.5-compact.apk > SmartIR-v1.2.5-compact.apk.sha256
          ls -lh SmartIR-v1.2.5-*.apk

      - name: Upload SmartIR debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SmartIR-v1.2.5-debug
          path: |
            SmartIR-v1.2.5-debug.apk
            SmartIR-v1.2.5-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload SmartIR compact APK
        uses: actions/upload-artifact@v7
        with:
          name: SmartIR-v1.2.5-compact
          path: |
            SmartIR-v1.2.5-compact.apk
            SmartIR-v1.2.5-compact.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SmartIR-v1.2.5-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30

  firmware-analysis-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Build official unsquashfs
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential liblzo2-dev zlib1g-dev liblzma-dev liblz4-dev libzstd-dev
          git clone --depth 1 https://github.com/plougher/squashfs-tools.git
          make -C squashfs-tools/squashfs-tools unsquashfs XATTR_SUPPORT=1 LZO_SUPPORT=1 LZ4_SUPPORT=1 XZ_SUPPORT=1 ZSTD_SUPPORT=1
          mkdir -p artifact
          cp squashfs-tools/squashfs-tools/unsquashfs artifact/
          ldd artifact/unsquashfs | tee artifact/ldd.txt
          sha256sum artifact/unsquashfs | tee artifact/unsquashfs.sha256

      - name: Upload analysis tool
        uses: actions/upload-artifact@v7
        with:
          name: unsquashfs-linux-amd64
          path: artifact/
          if-no-files-found: error
          retention-days: 7
