name: SmartIR Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartir-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Create ephemeral CI signing key
        run: |
          mkdir -p "$HOME/.smartir"
          PASS="ci-smartir-1.4.2-only"
          keytool -genkeypair \
            -keystore "$HOME/.smartir/smartir-release.jks" \
            -storetype PKCS12 \
            -storepass "$PASS" \
            -alias smartir \
            -keypass "$PASS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=SmartIR CI,O=SkallaHaze74-Pro,C=DE" \
            -noprompt
          cat > "$HOME/.smartir/signing.properties" <<EOF
          storePassword=$PASS
          keyAlias=smartir
          keyPassword=$PASS
          EOF

      - name: Test, lint and build stable release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleRelease

      - name: Verify APK signature schemes
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee apksigner-verify.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner-verify.txt

      - name: Prepare CI test APK and checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk SmartIR-v1.4.2-CI-ephemeral-signature.apk
          sha256sum SmartIR-v1.4.2-CI-ephemeral-signature.apk > SmartIR-v1.4.2-CI-ephemeral-signature.apk.sha256

      - name: Upload CI test APK
        uses: actions/upload-artifact@v7
        with:
          name: SmartIR-v1.4.2-CI-ephemeral-signature-DO-NOT-USE-FOR-UPDATES
          path: |
            SmartIR-v1.4.2-CI-ephemeral-signature.apk
            SmartIR-v1.4.2-CI-ephemeral-signature.apk.sha256
            apksigner-verify.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SmartIR-v1.4.2-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30

  firmware-analysis-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Build official unsquashfs
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential liblzo2-dev zlib1g-dev liblzma-dev liblz4-dev libzstd-dev
          git clone --depth 1 https://github.com/plougher/squashfs-tools.git
          make -C squashfs-tools/squashfs-tools unsquashfs XATTR_SUPPORT=1 LZO_SUPPORT=1 LZ4_SUPPORT=1 XZ_SUPPORT=1 ZSTD_SUPPORT=1
          mkdir -p artifact
          cp squashfs-tools/squashfs-tools/unsquashfs artifact/
          ldd artifact/unsquashfs | tee artifact/ldd.txt
          sha256sum artifact/unsquashfs | tee artifact/unsquashfs.sha256

      - name: Upload analysis tool
        uses: actions/upload-artifact@v7
        with:
          name: unsquashfs-linux-amd64
          path: artifact/
          if-no-files-found: error
          retention-days: 7
