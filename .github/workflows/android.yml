name: SmartIR + Music Capsule Android APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smartir-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate SmartIR and webOS assets
        run: |
          node --check webos-audio-bridge/app.js
          node --check webos-audio-bridge/visualizer.js
          python -m json.tool webos-audio-bridge/appinfo.json >/dev/null
          grep -F '"version": "0.6.1"' webos-audio-bridge/appinfo.json
          grep -F 'visualizer.js?v=061' webos-audio-bridge/index-v061.html
          grep -F 'HQ Smooth' webos-audio-bridge/index-v061.html
          grep -F "versionName '1.5.1'" app/build.gradle
          ! grep -Fq 'MusicCapsuleActivity' app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Create ephemeral SmartIR signing key
        run: |
          mkdir -p "$HOME/.smartir"
          PASS="ci-smartir-1.5.1-only"
          keytool -genkeypair \
            -keystore "$HOME/.smartir/smartir-release.jks" \
            -storetype PKCS12 \
            -storepass "$PASS" \
            -alias smartir \
            -keypass "$PASS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=SmartIR CI,O=SkallaHaze74-Pro,C=DE" \
            -noprompt
          cat > "$HOME/.smartir/signing.properties" <<EOF
          storePassword=$PASS
          keyAlias=smartir
          keyPassword=$PASS
          EOF

      - name: Test, lint and build SmartIR release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Verify SmartIR APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee smartir-apksigner-verify.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" smartir-apksigner-verify.txt

      - name: Prepare SmartIR artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk SmartIR-v1.5.1-CI-ephemeral-signature.apk
          sha256sum SmartIR-v1.5.1-CI-ephemeral-signature.apk > SmartIR-v1.5.1-CI-ephemeral-signature.apk.sha256

      - name: Upload SmartIR CI APK
        uses: actions/upload-artifact@v7
        with:
          name: SmartIR-v1.5.1-CI-ephemeral-signature-DO-NOT-USE-FOR-UPDATES
          path: |
            SmartIR-v1.5.1-CI-ephemeral-signature.apk
            SmartIR-v1.5.1-CI-ephemeral-signature.apk.sha256
            smartir-apksigner-verify.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload SmartIR lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SmartIR-v1.5.1-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30

  music-capsule-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Music Capsule 1.2.1 SoundCloud fallback
        run: |
          grep -F 'include(":musiccapsule")' settings.gradle
          grep -F "applicationId 'com.skallahaze.musiccapsule'" musiccapsule/build.gradle
          grep -F "versionName '1.2.1'" musiccapsule/build.gradle
          grep -F 'class PlaybackAnalyzerService' musiccapsule/src/main/java/com/skallahaze/musiccapsule/PlaybackAnalyzerService.kt
          grep -F 'MICROPHONE_FALLBACK' musiccapsule/src/main/java/com/skallahaze/musiccapsule/PlaybackAnalyzerService.kt
          grep -F 'externalAudioRouteActive' musiccapsule/src/main/java/com/skallahaze/musiccapsule/PlaybackAnalyzerService.kt
          grep -F 'soundcloud-microphone-fallback' musiccapsule/src/main/java/com/skallahaze/musiccapsule/PlaybackAnalyzerService.kt
          grep -F 'FOREGROUND_SERVICE_MICROPHONE' musiccapsule/src/main/AndroidManifest.xml
          grep -F 'mediaProjection|microphone' musiccapsule/src/main/AndroidManifest.xml
          grep -F 'class CapsuleNotificationListener' musiccapsule/src/main/java/com/skallahaze/musiccapsule/CapsuleNotificationListener.kt
          grep -F 'class CapsuleMediaSessionPoller' musiccapsule/src/main/java/com/skallahaze/musiccapsule/CapsuleMediaSessionPoller.kt
          grep -F 'maximumWindowMetrics' musiccapsule/src/main/java/com/skallahaze/musiccapsule/CapsuleOverlayService.kt
          grep -F 'setFitInsetsTypes(0)' musiccapsule/src/main/java/com/skallahaze/musiccapsule/CapsuleOverlayService.kt
          grep -F 'LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS' musiccapsule/src/main/java/com/skallahaze/musiccapsule/CapsuleOverlayService.kt
          grep -F 'drawSymbols' musiccapsule/src/main/java/com/skallahaze/musiccapsule/EdgePanelView.kt
          grep -F 'drawExpandHandle' musiccapsule/src/main/java/com/skallahaze/musiccapsule/CapsuleOverlayView.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Create ephemeral Music Capsule signing key
        run: |
          mkdir -p "$HOME/.musiccapsule"
          PASS="ci-music-capsule-1.2.1-only"
          keytool -genkeypair \
            -keystore "$HOME/.musiccapsule/music-capsule-release.jks" \
            -storetype PKCS12 \
            -storepass "$PASS" \
            -alias musiccapsule \
            -keypass "$PASS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Music Capsule CI,O=SkallaHaze74-Pro,C=DE" \
            -noprompt
          cat > "$HOME/.musiccapsule/signing.properties" <<EOF
          storePassword=$PASS
          keyAlias=musiccapsule
          keyPassword=$PASS
          EOF

      - name: Lint and build standalone Music Capsule
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :musiccapsule:lintRelease :musiccapsule:assembleRelease

      - name: Verify Music Capsule APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs musiccapsule/build/outputs/apk/release/musiccapsule-release.apk | tee musiccapsule-apksigner-verify.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" musiccapsule-apksigner-verify.txt || \
            grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" musiccapsule-apksigner-verify.txt

      - name: Prepare Music Capsule artifact
        run: |
          cp musiccapsule/build/outputs/apk/release/musiccapsule-release.apk MusicCapsule-v1.2.1-CI-ephemeral-signature.apk
          sha256sum MusicCapsule-v1.2.1-CI-ephemeral-signature.apk > MusicCapsule-v1.2.1-CI-ephemeral-signature.apk.sha256

      - name: Upload standalone Music Capsule CI APK
        uses: actions/upload-artifact@v7
        with:
          name: MusicCapsule-v1.2.1-CI-ephemeral-signature-DO-NOT-USE-FOR-UPDATES
          path: |
            MusicCapsule-v1.2.1-CI-ephemeral-signature.apk
            MusicCapsule-v1.2.1-CI-ephemeral-signature.apk.sha256
            musiccapsule-apksigner-verify.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Music Capsule lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MusicCapsule-v1.2.1-lint
          path: musiccapsule/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 30

  firmware-analysis-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Build official unsquashfs
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential liblzo2-dev zlib1g-dev liblzma-dev liblz4-dev libzstd-dev
          git clone --depth 1 https://github.com/plougher/squashfs-tools.git
          make -C squashfs-tools/squashfs-tools unsquashfs XATTR_SUPPORT=1 LZO_SUPPORT=1 LZ4_SUPPORT=1 XZ_SUPPORT=1 ZSTD_SUPPORT=1
          mkdir -p artifact
          cp squashfs-tools/squashfs-tools/unsquashfs artifact/
          ldd artifact/unsquashfs | tee artifact/ldd.txt
          sha256sum artifact/unsquashfs | tee artifact/unsquashfs.sha256

      - name: Upload analysis tool
        uses: actions/upload-artifact@v7
        with:
          name: unsquashfs-linux-amd64
          path: artifact/
          if-no-files-found: error
          retention-days: 7
