name: SmartIR Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartir-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test, lint and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug

      - name: Prepare named APK and checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SmartIR-v1.2.2-debug.apk
          sha256sum SmartIR-v1.2.2-debug.apk > SmartIR-v1.2.2-debug.apk.sha256

      - name: Upload SmartIR APK
        uses: actions/upload-artifact@v7
        with:
          name: SmartIR-v1.2.2-debug
          path: |
            SmartIR-v1.2.2-debug.apk
            SmartIR-v1.2.2-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SmartIR-v1.2.2-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30
