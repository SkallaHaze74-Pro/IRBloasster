name: Twitch TV Pro Pages

on:
  push:
    branches: [feature/twitch-tv-pro-1.0]
    paths:
      - 'web/twitch-tv-pro/**'
      - '.github/workflows/twitch-tv-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: twitch-tv-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Twitch TV Pro site
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/twitch-tv-pro

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
