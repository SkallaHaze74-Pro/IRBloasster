<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoundCloud TV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <section class="card">
      <div class="wave" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <h1>SoundCloud TV</h1>
      <p id="status">SoundCloud wird im LG-Browser geöffnet …</p>

      <div class="actions">
        <button id="library" type="button" autofocus>Meine Bibliothek öffnen</button>
        <button id="login" class="secondary" type="button">Einmal anmelden / Konto wechseln</button>
      </div>

      <p class="hint">
        Die Anmeldung läuft im eingebauten LG-Browser. Dadurch bleiben die SoundCloud-Cookies erhalten,
        bis du dich abmeldest, die Browserdaten löschst oder SoundCloud die Sitzung beendet.
      </p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
